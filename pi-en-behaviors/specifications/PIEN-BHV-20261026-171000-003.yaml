    title: A group selector lists its descendant behavior specifications
    given: [{term: isolated fixture, args: {name: group-selection}}]
    when: [{term: behavior group listing, args: {group: features}}]
    then: [{term: behavior output, args: {contains: PIEN-BHV-20261026-171000-003}}]
  - id: catalog-identity
    title: The generated catalog includes behavior identity and group metadata
    given: [{term: isolated fixture, args: {name: catalog-identity}}]
    when: [{term: behavior catalog generation, args: {}}]
    then: [{term: behavior output, args: {contains: '"group": "features/behavior-specifications"'}}]
