  item_id: PIEN-FRQ-20260612-210000-064
  status: active
  title: Host agent directory detection
  body: '#### AGENT-002 Host agent directory detection


    The host Pi agent directory must be selected in this order:


    1. `PI_EN_BWRAP_HOST_AGENT_DIR`

    2. `PI_CODING_AGENT_DIR`

    3. `$HOME/.pi/agent`'
  applicable_repos: null
  behavior_coverage: optional
