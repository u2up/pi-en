  item_id: PIEN-QRQ-20260701-110524-001
  status: active
  title: Host runtime documentation coverage
  body: "#### DOC-004 Host default and Nix opt-in documentation\n\nUser-facing documentation\
    \ must describe host runtime mode as the normal\ndirect-start path and Nix runtime\
    \ mode as the reproducible pinned opt-in.\n\nDocumentation updates must include:\n\
    \n- revised host prerequisites that make Nix optional for direct host-runtime\n\
