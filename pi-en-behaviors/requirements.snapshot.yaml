- requirement_key: UC-022
  item_id: PIEN-FRQ-20260612-210000-022
  status: active
  title: Safer code-review and automation workflows
  body: "#### UC-022 \u2014 Safer code-review and automation workflows\n\n- Type:\
    \ Functional requirement\n- Requirement kind: workflow\n- Related requirements:\
    \ UC-004, UC-007, UC-014, UC-015, FS-010, GIT-007, NET-002\n\nThe isolated launcher\
    \ must support safer workflows such as reviewing unfamiliar repositories, limiting\
    \ Pi to the selected project root mounted at `/workspace`, avoiding accidental\
    \ access to host secrets, using reduced tool allowlists, disabling network, using\
    \ ephemeral state, and importing only the auth/session/config needed for the current\
    \ project."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: UC-023
  item_id: PIEN-FRQ-20260612-210000-023
  status: active
  title: Coordinate multiple agents with Git
  body: "#### UC-023 \u2014 Coordinate multiple agents with Git\n\n- Type: Functional\
    \ requirement\n- Requirement kind: workflow\n- Related requirements: CMD-009 through\
    \ CMD-015, ENV-006, FS-010\n\nFor projects where several agents coordinate through\
    \ separate clones,\n`pi-en` must optionally help establish and maintain a dedicated\
    \ Git-backed\nproject coordination repository. Fresh project-local operational\
    \ artifacts\nfor this workflow, including the coordination working clone and local\
    \ bare\nremotes, must live under `.pi-en/` by default. Agents synchronize only\
    \ by\nnormal Git pull/commit/push operations. This use case remains opt-in, and\n\
    default `pi-en` startup behavior must not mutate coordination state automatically.\n\
    A coordination domain can cover multiple implementation repositories, but\neach\
    \ pi-en invocation remains attached to one selected implementation repo.\nThe\
    \ coordination clone contains root `PROJECT.md`, shared `requirements/`,\n`todos/`,\
    \ `decisions/`, and `notes/` entries, plus repo-scoped issue\nnamespaces under\
    \ `repos/<repo_id>/issues/<status>`. Each issue belongs to\nexactly one implementation\
    \ repo by path; cross-repo work should use one issue\nper repo linked by stable\
    \ item IDs. Each `repos/<repo_id>/REPO.md` may define\ndomain-wide generated files\
    \ that are committed by that implementation\nrepository, using repo-root relative\
    \ paths such as `REQUIREMENTS.md` or\n`REQUIREMENTS_COVERAGE.md`. More than one\
    \ active implementation repo may\nlist the same generated path when multiple committed\
    \ copies are useful."
  applicable_repos: null
  behavior_coverage: optional
