- requirement_key: DOC-002
  item_id: PIEN-QRQ-20260613-183457-001
  status: active
  title: Document direct and project-integrated getting started workflows
  body: '#### DOC-002 Getting started workflows


    The main `README.md` must include a concise `Getting started` section near

    the top that explains both supported `pi-en` use modes.


    The direct-use subsection must show how to start from an arbitrary target

    project without editing that project:


    ```bash

    cd /path/to/project

    /path/to/pi-en/pi-en

    ```


    It must also include examples for passing a prompt and for raw custom Pi

    arguments through `pi-en --raw -- ...`.


    The project-integrated subsection must describe when to wire `pi-en` into

    a target project''s flake, including pinned `pi-en` inputs, shared team

    setup, project-specific Nix dependencies, and running from inside the

    project devshell:


    ```bash

    nix develop

    pi-en

    ```


    The getting-started text must also mention that default `pi-en` startup

    loads the role-manager package when available, while

    `PI_EN_ROLE_MANAGER_AUTO=0` disables that behavior.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: DOC-003
  item_id: PIEN-QRQ-20260614-180310-001
  status: active
  title: Document project-specific sandbox tools
  body: '#### DOC-003 Project-specific sandbox tool documentation


    The README must explain that pi-en intentionally keeps its default

    runtime small and does not include every compiler, build system, or

    project test dependency by default.


    Documentation must show the recommended way to make project-specific

    development tools available inside the sandbox: declare them as Nix

    packages in a consuming project''s `mkPiShell { extraPackages = ...; }`

    configuration, then run `pi-en` from that project devshell.


    Documentation must also describe the security boundary for this feature:

    extra command directories are explicit Nix-store paths, `/nix/store` is

    mounted read-only, host `/bin` and `/usr/bin` are not mounted as the tool

    source, and direct `nix run` examples are suitable for inspection but may

    lack project build/test tools unless the project integrates pi-en or an

    explicit extra path is provided.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: TEST-032
  item_id: PIEN-QRQ-20260615-175842-001
  status: active
  title: Serial automation verification coverage
  body: "#### TEST-032 Serial automation smoke coverage\n\nThe serial automation implementation\
    \ must have automated coverage that\nexercises work selection and command construction\
    \ without contacting a real\nmodel provider.\n\nVerification should use temporary\
    \ project and coordination repositories and\na fake `pi` executable or dry-run\
    \ mode to assert that:\n\n- tester-eligible done/reviewed/unverified work is selected\
    \ before reviewer\n  or developer work;\n- reviewer-eligible done/unreviewed work\
    \ is selected before developer work;\n- open developer work is claimed before\
    \ the developer Pi job is launched;\n- no job is launched when all queues are\
    \ empty;\n- each Pi invocation omits `--continue` and names exactly one coordination\n\
    \  item;\n- the serial lock prevents two orchestrators from running in the same\n\
    \  checkout;\n- unexpected dirty project state stops the loop instead of being\
    \ discarded;\n- dirty coordination state during idle pre-selection is treated\
    \ as a busy\n  checkout without pulling, selecting, claiming, stashing, resetting,\
    \ or\n  discarding."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: TEST-033
  item_id: PIEN-QRQ-20260701-110522-001
  status: active
  title: Host runtime blackbox coverage
  body: "#### TEST-033 Host runtime blackbox coverage\n\nThe host runtime implementation\
    \ must have blackbox-style tests that do not\ncontact a real model provider and\
    \ can inspect launcher behavior with fake\n`pi` and/or fake `bwrap` commands.\n\
    \nCoverage must verify that:\n\n- direct checkout `pi-en` in default mode does\
    \ not invoke `nix develop`;\n- explicit Nix runtime selection preserves the existing\
    \ Nix-backed path;\n- explicit host runtime selection fails before Bubblewrap\
    \ when required\n  host dependencies are missing;\n- host-mode sandbox `PATH`\
    \ is constructed from documented allowlisted host\n  paths rather than arbitrary\
    \ caller `PATH` inheritance;\n- admitted host command and support paths are mounted\
    \ read-only;\n- host `$HOME`, SSH keys, cloud credentials, Docker sockets, and\
    \ unrelated\n  project trees are not mounted by default;\n- a `pi` path under\
    \ host `$HOME` fails closed or requires an explicit\n  documented opt-in;\n- role-manager\
    \ and coordination helper behavior either works in host mode\n  or fails with\
    \ clear diagnostics."
  applicable_repos: null
  behavior_coverage: optional
