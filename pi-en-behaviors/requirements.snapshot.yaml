  behavior_coverage: optional
- requirement_key: AGENT-009
  item_id: PIEN-FRQ-20260612-210000-071
  status: active
  title: Auth sync policy
  body: '#### AGENT-009 Auth sync policy


    `PI_EN_BWRAP_AUTH_SYNC=always` or unset must refresh auth/model files each run.


    `PI_EN_BWRAP_AUTH_SYNC=missing` must copy only absent auth/model files.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: AGENT-010
  item_id: PIEN-FRQ-20260612-210000-072
  status: active
  title: Global extensions and packages
  body: '#### AGENT-010 Global extensions and packages


    When extension import is enabled and the host agent directory exists, the launcher
    must make globally available Pi extensions and installed Pi packages usable inside
    the sandbox:


    - copy `settings.json` into the sandbox agent directory;

    - expose `extensions/`, `npm/`, and `git/` from the host agent directory read-only
    when present.


    Project-local `.pi/extensions`, `.pi/settings.json`, `.pi/npm`, and `.pi/git`
    are available through the `/workspace` project mount.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: AGENT-010a
  item_id: PIEN-FRQ-20260612-210000-073
  status: active
  title: Extension import disable
  body: '#### AGENT-010a Extension import disable


    `PI_EN_BWRAP_IMPORT_EXTENSIONS=0` must prevent copying `settings.json` and exposing
    host global `extensions/`, `npm/`, and `git/` directories.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: AGENT-010b
  item_id: PIEN-FRQ-20260612-210000-074
  status: active
  title: Extension sync policy
  body: '#### AGENT-010b Extension sync policy


    `PI_EN_BWRAP_EXTENSIONS_SYNC=always` or unset must refresh the sandbox copy of
    `settings.json` each run.


    `PI_EN_BWRAP_EXTENSIONS_SYNC=missing` must copy `settings.json` only when it is
    absent in sandbox state.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: AGENT-011
  item_id: PIEN-FRQ-20260612-210000-075
  status: active
  title: Sessions default
  body: '#### AGENT-011 Sessions default


    Project sessions must be imported/bind-mounted by default for persistent homes,
    and disabled by default for ephemeral homes.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: AGENT-012
  item_id: PIEN-FRQ-20260612-210000-076
  status: active
  title: Sessions override
  body: '#### AGENT-012 Sessions override


    `PI_EN_BWRAP_IMPORT_SESSIONS=0` must disable session bind mounting.


    `PI_EN_BWRAP_IMPORT_SESSIONS=1` must enable session bind mounting, including with
    ephemeral homes.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: AGENT-013
  item_id: PIEN-FRQ-20260612-210000-077
  status: active
  title: Session scope
  body: '#### AGENT-013 Session scope


    The launcher must bind only the host Pi session directory corresponding to the
    current host cwd into the sandbox session directory corresponding to the mapped
    sandbox cwd.


    It must not mount all host Pi sessions.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: AGENT-014
  item_id: PIEN-FRQ-20260612-210000-078
  status: active
  title: Session naming
  body: '#### AGENT-014 Session naming


    Session directory names must be derived by normalizing the path, stripping the
    leading slash, replacing `/` and `:` with `-`, and surrounding the result with
    `--`.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: AGENT-015
  item_id: PIEN-FRQ-20260612-210000-079
  status: active
  title: Session migration
  body: '#### AGENT-015 Session migration


    Before bind-mounting host sessions, the launcher may copy existing sandbox session
    `*.jsonl` files into the host project session directory without overwriting existing
    files.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: GIT-001
  item_id: PIEN-FRQ-20260612-210000-080
  status: active
  title: Git config import default
  body: '#### GIT-001 Git config import default


    Host Git configuration import must be enabled by default.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: GIT-002
  item_id: PIEN-FRQ-20260612-210000-081
  status: active
  title: Global git config source
  body: '#### GIT-002 Global git config source


    The global Git config source must default to `$HOME/.gitconfig` and be overridable
    with `PI_EN_BWRAP_HOST_GITCONFIG`.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: GIT-003
  item_id: PIEN-FRQ-20260612-210000-082
  status: active
  title: XDG git config source
  body: '#### GIT-003 XDG git config source


    The XDG Git config source must default to `$XDG_CONFIG_HOME/git/config` when `XDG_CONFIG_HOME`
    is set, otherwise `$HOME/.config/git/config`, and be overridable with `PI_EN_BWRAP_HOST_XDG_GIT_CONFIG`.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: GIT-004
  item_id: PIEN-FRQ-20260612-210000-083
  status: active
  title: Git config targets
  body: '#### GIT-004 Git config targets


    Copied Git config files must appear inside the sandbox as:


    - `/home/pi/.gitconfig`

    - `/home/pi/.config/git/config`'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: GIT-005
  item_id: PIEN-FRQ-20260612-210000-084
  status: active
  title: Git config disable
  body: '#### GIT-005 Git config disable


    `PI_EN_BWRAP_IMPORT_GIT_CONFIG=0` must prevent importing Git config.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: GIT-006
  item_id: PIEN-FRQ-20260612-210000-085
  status: active
  title: Git config sync policy
  body: '#### GIT-006 Git config sync policy


    `PI_EN_BWRAP_GIT_CONFIG_SYNC=always` or unset must refresh copied Git config each
    run.


    `PI_EN_BWRAP_GIT_CONFIG_SYNC=missing` must preserve existing sandbox copies.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: GIT-007
  item_id: PIEN-FRQ-20260612-210000-086
  status: active
  title: No credential import
  body: '#### GIT-007 No credential import


    Git credentials, SSH keys, signing keys, credential helper backing stores, and
    other referenced files must not be imported automatically.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: GIT-008
  item_id: PIEN-FRQ-20260612-210000-087
  status: active
  title: System Git config
  body: '#### GIT-008 System Git config


    The sandbox must set `GIT_CONFIG_NOSYSTEM=1`.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: ENV-001
  item_id: PIEN-FRQ-20260612-210000-088
  status: active
  title: Clear environment
  body: '#### ENV-001 Clear environment


    Bubblewrap must be invoked with `--clearenv`.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: ENV-002
  item_id: PIEN-FRQ-20260612-210000-089
  status: active
  title: Basic terminal variables
  body: '#### ENV-002 Basic terminal variables


    The launcher must set or pass through terminal-related variables:


    - set `TERM`, defaulting to `xterm-256color`

    - pass `COLORTERM` when set and non-empty

    - pass `NO_COLOR` when set and non-empty

    - pass `FORCE_COLOR` when set and non-empty'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: ENV-003
  item_id: PIEN-FRQ-20260612-210000-090
  status: active
  title: Provider credentials
  body: '#### ENV-003 Provider credentials


    The launcher may pass selected LLM provider variables, including API keys and
    base URLs listed in `flake.nix`. No arbitrary host environment variable may be
    passed unless explicitly requested.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: ENV-004
  item_id: PIEN-FRQ-20260612-210000-091
  status: active
  title: Extra environment pass-through
  body: '#### ENV-004 Extra environment pass-through


    `PI_EN_BWRAP_PASS_ENV` must accept extra environment variable names separated
    by spaces, commas, or colons and pass through only those names when set and non-empty.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: ENV-005
  item_id: PIEN-FRQ-20260612-210000-092
  status: active
  title: Sandbox identity/env
  body: '#### ENV-005 Sandbox identity/env


    Inside the sandbox the launcher must set:


    - `HOME=/home/pi`

    - `SHELL=/bin/bash`

    - `USER=pi`

    - `LOGNAME=pi`

    - `PWD` to the mapped sandbox cwd

    - `XDG_CACHE_HOME=/home/pi/.cache`

    - `TMPDIR=/tmp`

    - `PATH` to include the Nix runtime path, `/usr/local/bin`, `/usr/bin`, and `/bin`

    - `SSL_CERT_FILE` and `NIX_SSL_CERT_FILE` to Nix `cacert`

    - `PI_SKIP_VERSION_CHECK`, defaulting to `1`

    - `PI_TELEMETRY`, defaulting to `0`'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: ENV-006
  item_id: PIEN-FRQ-20260612-210000-093
  status: active
  title: Coordination context
  body: '#### ENV-006 Coordination context


    When set or declared in `.pi-en-coordination.yaml`, the launcher must pass

    safe coordination context into the sandbox:


    - `PI_EN_COORD_REMOTE`

    - `--root`

    - `PI_EN_COORD_PROJECT`

    - `PI_EN_COORD_AGENT_ID`

    - `PI_EN_COORD_PROJECT_KEY`

    - `PI_EN_COORD_ROLE`


    If `PI_EN_COORD_REMOTE` points inside the selected project, or is read as a

    project-local `coordination_remote`, the launcher must pass it into the

    sandbox as the corresponding `/workspace/...` path. If explicit

    `PI_EN_COORD_REMOTE` points to an existing local path outside the selected

    project, the launcher must bind its parent directory read-write and pass the

    sandbox-visible remote path. External local paths read only from project

    configuration must not trigger host-path binds unless the user also opts in

    with explicit environment context such as `PI_EN_COORD_REMOTE` or

    `--root`.


    If legacy `--root` points inside the selected project, the launcher

    must pass it into the sandbox as the corresponding `/workspace/...` path.

    Project-local `.pi-en/agent-remotes` is the default for local bare remotes.


    If a coordination clone is detected under the selected project at

    `.pi-en/coordination`, or selected with

    `PI_EN_COORD_DIR`/`PI_EN_BWRAP_COORDINATION_DIR`, the selected path must

    resolve to the project-local `.pi-en/coordination` checkout. The launcher

    must set `PI_EN_COORD_DIR` inside the sandbox to the sandbox-visible

    `/workspace/.pi-en/coordination` path.


    `PI_EN_BWRAP_COORDINATION_DIR` must not bind an external coordination clone

    at `/coordination`. Automatic Pi-en workflows must reject external

    `PI_EN_COORD_DIR` or `PI_EN_BWRAP_COORDINATION_DIR` clone paths with a clear

    diagnostic that points users at `<project-root>/.pi-en/coordination`. The

    launcher may print a reminder when a coordination repository is available,

    but it must not mutate coordination state.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: NET-001
  item_id: PIEN-FRQ-20260612-210000-094
  status: active
  title: Default network
  body: '#### NET-001 Default network


    The sandbox must share the host network by default so Pi can reach model providers.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: NET-002
  item_id: PIEN-FRQ-20260612-210000-095
  status: active
  title: Disable network
  body: '#### NET-002 Disable network


    `PI_EN_BWRAP_NET=0` must avoid adding Bubblewrap `--share-net`.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: CMD-017
  item_id: PIEN-FRQ-20260613-090608-001
  status: active
  title: Built-in role tool allowlists
  body: '#### CMD-017 Built-in role tool allowlists


    The role-manager package must preserve bundled role metadata, including

    role-specific tool allowlists, when loaded from this repository or as an

    external Pi package. Activating a bundled role must request its declared

    tool set from the host Pi runtime and warn with the missing tool names

    when any requested tool is not registered.


    Bundled base roles must declare these tool allowlists:


    - `architect`: `read`, `grep`, `find`, `ls`, `bash`, `edit`, `write`

    - `developer`: `read`, `grep`, `find`, `ls`, `edit`, `write`, `bash`

    - `builder`: `read`, `grep`, `find`, `ls`, `bash`, `edit`

    - `tester`: `read`, `grep`, `find`, `ls`, `bash`, `edit`, `write`

    - `reviewer`: `read`, `grep`, `find`, `ls`, `bash`


    Custom user roles may declare their own allowlists and must not be

    forced to match bundled role policy.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: CMD-018
  item_id: PIEN-FRQ-20260613-183404-001
  status: active
  title: Provide a pi-en top-level launcher
  body: "#### CMD-018 pi-en top-level launcher\n\n`pi-en` must provide the top-level\
    \ entrypoint for starting Pi from any\ntarget project while reusing `pi-en-bwrap`\
    \ for sandbox construction.\n\nDefault invocation from a target project must be\
    \ equivalent in behavior\nto entering the selected `pi-en` Nix devshell and running\
    \ `pi-en`:\n\n```bash\ncd /path/to/project\npi-en\n```\n\nThe launcher must preserve\
    \ the caller's current working directory so\n`pi-en-bwrap` project-root detection\
    \ continues to mount the target project\nat `/workspace`.\n\nThe launcher must\
    \ support these direct-use controls:\n\n- `pi-en [args...]` applies the default\
    \ startup policy itself after\n  entering the selected devshell, then delegates\
    \ to `pi-en-bwrap`.\n- `pi-en --raw -- [pi args...]` delegates to `pi-en-bwrap\
    \ -- [pi args...]`\n  for fully custom Pi argument forwarding.\n- `pi-en --flake\
    \ REF ...` or `PI_EN_FLAKE=REF pi-en ...` selects the\n  `pi-en` flake to enter\
    \ for direct use.\n\nThe flake must also expose a Nix-provided `pi-en` package/app\
    \ and include\nit in the default devshell so project-integrated users can run\
    \ `pi-en`\nafter `nix develop` without a separate checkout script."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: CMD-019
  item_id: PIEN-FRQ-20260613-183411-001
  status: active
  title: Auto-load role-manager during default startup
  body: "#### CMD-019 Default role-manager startup integration\n\nDefault `pi-en`\
    \ startup must load the pi-en role-manager package by\ndefault when the package\
    \ is available, without requiring users to remember\nan explicit `-e \"$PI_EN_ROLE_MANAGER_PACKAGE\"\
    ` argument for normal\nstartup.\n\nThe default integration must:\n\n- load the\
    \ role-manager as a per-run Pi package/extension, not by\n  mutating global or\
    \ project Pi settings;\n- preserve the existing default tool allowlist behavior,\
    \ `--continue`,\n  and caller-supplied Pi arguments;\n- use `PI_EN_ROLE_MANAGER_PACKAGE`\
    \ when set, otherwise use the Nix-built\n  role-manager package path known to\
    \ `pi-en`;\n- skip role-manager loading gracefully when no package path is available\n\
    \  or the path does not exist;\n- allow opt-out with `PI_EN_ROLE_MANAGER_AUTO=0`;\n\
    - avoid duplicate command/tool registration surprises when the package is\n  also\
    \ installed through Pi settings, either through extension\n  idempotency or by\
    \ documenting the opt-out path.\n\nRole-manager loading must not activate a role\
    \ by itself. Role activation\nremains controlled by stored session role state,\
    \ `/role`, `/role-cycle`,\n`/role-new`, or explicit role environment variables\
    \ supported by the\nrole-manager extension."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: RUNTIME-003
  item_id: PIEN-FRQ-20260614-180306-001
  status: active
  title: Expose project-declared Nix tools in sandbox PATH
  body: '#### RUNTIME-003 Project-declared Nix tool PATH exposure


    `pi-en` must let projects that consume `pi-en.lib.mkPiShell` expose

    their declared Nix `extraPackages` command directories inside the

    Bubblewrap sandbox without expanding host filesystem access.


    `mkPiShell` must derive the executable search path for `extraPackages`

    from Nix package outputs, using the package `bin` directories normally

    produced by Nix path construction, and export that list through a

    dedicated pi-en environment variable for `pi-en-bwrap`.


    `pi-en-bwrap` must add the validated extra command directories to the

    sandbox `PATH` after the core pi-en runtime path and before host/global

    fallback locations such as `/usr/local/bin`, `/usr/bin`, and `/bin`.

    The core pi-en runtime must therefore keep precedence for launcher

    dependencies, while project-declared tools such as `make`, `gcc`,

    `pkg-config`, or `cmake` become discoverable to Pi tool commands.


    Direct `nix run github:u2up/pi-en` usage is not required to infer a

    target project''s build tools automatically. Projects that need build or

    test tools inside the sandbox should either integrate pi-en through a

    project flake/devshell or use an explicit, documented extra-path opt-in.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: UC-024
  item_id: PIEN-FRQ-20260615-175835-001
  status: active
  title: Serial role automation workflow
  body: "#### UC-024 Serial role automation workflow\n\nA user must be able to run\
    \ one serial automation loop over a single\nproject checkout and one coordination\
    \ checkout. The loop polls the\ncoordination repository, selects one eligible\
    \ issue, runs exactly one\ndeveloper, reviewer, or tester Pi job for that issue,\
    \ waits for the job to\nfinish, and then returns to polling.\n\nThe serial workflow\
    \ must avoid concurrent writes to the project and\ncoordination working trees.\
    \ Its generated operational artifacts, such as\nlocal locks and optional logs,\
    \ must live under `.pi-en/` by default. It is\nthe first automation step before\
    \ any future tmux, multi-clone, or parallel\nworker design.\n\nAcceptance criteria:\n\
    \n- The documented workflow uses one orchestrator process rather than three\n\
    \  parallel terminals.\n- The orchestrator prefers downstream work before new\
    \ development:\n  tester-eligible items, then reviewer-eligible items, then open\
    \ developer\n  items.\n- Each selected issue is handled in a fresh Pi session,\
    \ not by continuing\n  a previous role session.\n- The design explains that tmux\
    \ and per-role clone locking are deferred\n  until a later parallel-worker phase."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: CMD-020
  item_id: PIEN-FRQ-20260615-175837-001
  status: active
  title: Serial automation command
  body: "#### CMD-020 Serial role automation command\n\npi-en should provide a serial\
    \ automation command or script that can be\nrun from a project checkout containing,\
    \ or configured with, a coordination\ncheckout. The command must own the polling\
    \ loop outside Pi and invoke Pi\nonly for a concrete selected issue.\n\nThe command\
    \ must:\n\n- acquire a local lockfile under `.pi-en/locks/` before polling so\
    \ two\n  serial orchestrators do not accidentally operate in the same clone;\n\
    - pull/rebase coordination before selecting work when the coordination\n  checkout\
    \ is clean;\n- treat a dirty coordination checkout during idle pre-selection polling\
    \ as\n  a temporary busy condition without pulling, inspecting, selecting,\n \
    \ claiming, stashing, resetting, or discarding;\n- stop rather than discard or\
    \ auto-stash unexpected project changes;\n- select tester work from done issues\
    \ with `reviewed: true` and\n  `verified: false`;\n- select reviewer work from\
    \ done issues with `reviewed: false`;\n- select developer work from open issues\
    \ and claim it before launching the\n  developer job;\n- optionally limit selection\
    \ to a caller-provided ordered batch of explicit\n  issue IDs while preserving\
    \ tester, reviewer, then developer priority;\n- reject unknown explicit issue\
    \ IDs, duplicate explicit issue IDs, and\n  explicit IDs that resolve to non-issue\
    \ items before running a Pi job;\n- sleep and poll again when no eligible issue\
    \ exists in default queue mode;\n- exit successfully when an explicit requested\
    \ issue batch has no currently\n  eligible work;\n- allow a bounded or dry-run\
    \ mode suitable for automated tests.\n\nThe command must not require tmux for\
    \ the serial mode."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: AGENT-016
  item_id: PIEN-FRQ-20260615-175838-001
  status: active
  title: Fresh role session per serial job
  body: "#### AGENT-016 Fresh role session per serial job\n\nEach serial automation\
    \ job must start a fresh Pi session for exactly one\ncoordination issue and one\
    \ active role. The automation must not use\n`--continue` for issue jobs and must\
    \ not let a developer, reviewer, or\ntester job select additional work after the\
    \ named item is complete.\n\nThe job invocation must provide role context for\
    \ developer, reviewer, and\ntester runs. If environment-based role activation\
    \ is used through the\nBubblewrap launcher, the command must pass the relevant\
    \ role activation\nvariable explicitly with `PI_EN_BWRAP_PASS_ENV`, because the\
    \ sandbox clears the\nambient host environment by default.\n\nRole prompts must\
    \ instruct jobs to update coordination through the\nappropriate helpers:\n\n-\
    \ developer jobs claim open work and mark it done with implementation refs;\n\
    - reviewer jobs pass or fail review with `pi-en-coord-review`;\n- tester jobs\
    \ pass or fail verification with `pi-en-coord-verify`;\n- final close is optional\
    \ and must only happen after done, reviewed, and\n  verified states are all present."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: UC-025
  item_id: PIEN-FRQ-20260701-110508-001
  status: active
  title: Host runtime sandbox default workflow
  body: "#### UC-025 Host runtime sandbox default workflow\n\nA user must be able\
    \ to run `pi-en` from a normal checkout without first\nentering `nix develop`\
    \ and without `pi-en` automatically invoking Nix.\nThe default direct-launch behavior\
    \ should run Pi inside the Bubblewrap\nworkspace sandbox using a conservative,\
    \ allowlisted host runtime.\n\nNix remains a first-class reproducible runtime.\
    \ Users must be able to opt\ninto the Nix-backed runtime explicitly, and invocations\
    \ that already enter\nthrough Nix package, app, profile, or development-shell\
    \ outputs may continue\nto use the Nix-backed runtime by default.\n\nAcceptance\
    \ criteria:\n\n- Direct checkout `pi-en` starts in host runtime mode unless the\
    \ caller\n  requests another runtime.\n- `pi-en --runtime host` and `PI_EN_RUNTIME=host`\
    \ select host runtime\n  mode explicitly.\n- `pi-en --runtime nix` and `PI_EN_RUNTIME=nix`\
    \ select the existing\n  pinned Nix runtime behavior.\n- The command output or\
    \ diagnostics make the selected runtime mode clear\n  when reporting missing tools\
    \ or startup failures.\n- Bubblewrap sandboxing, isolated HOME, filtered environment,\
    \ and the\n  `/workspace` project mount remain the default in both runtime modes."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: RUNTIME-004
  item_id: PIEN-FRQ-20260701-110510-001
  status: active
  title: Runtime mode selection
  body: '#### RUNTIME-004 Runtime mode selection


    The launcher stack must support explicit runtime modes named `host` and

    `nix`. Runtime mode may be selected by a command-line option such as

    `--runtime host|nix|auto` or by `PI_EN_RUNTIME=host|nix|auto`, with the

    command-line option taking precedence over the environment variable.


    Direct checkout use should default to host runtime mode. Nix-provided

    package, app, profile, and development-shell entrypoints should keep using

    Nix-backed paths unless the implementation explicitly documents and tests a

    safe host-mode override for those entrypoints.


    Runtime mode selection must be resolved before any fallback that would

    invoke `nix develop`. If host mode is selected and required host tools are

    missing, the launcher must fail with host-mode diagnostics rather than

    silently entering Nix.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: RUNTIME-005
  item_id: PIEN-FRQ-20260701-110512-001
  status: active
  title: Host runtime dependency preflight
  body: '#### RUNTIME-005 Host runtime dependency preflight


    Host runtime mode must validate required host commands before constructing

    the Bubblewrap command. At minimum, host mode must check for the commands

    needed by the launcher itself, Bubblewrap, project-root detection, state

    preparation, and Pi startup.


    Missing dependency diagnostics must:


    - identify that the selected runtime is `host`;

    - list the missing command names;

    - explain that host runtime tools are not pinned by pi-en;

    - suggest installing missing host packages or retrying with the Nix runtime.


    The implementation may treat some commands as optional when the feature that

    needs them is disabled, but optionality must be documented and tested.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: PATH-006
  item_id: PIEN-FRQ-20260701-110514-001
  status: active
  title: Conservative host tool path exposure
  body: '#### PATH-006 Conservative host tool path exposure


    Host runtime mode must not blindly inherit the caller''s full host `PATH`.

    It must construct the sandbox `PATH` from a documented allowlist of host

    command directories, defaulting to common system locations such as

    `/usr/local/bin`, `/usr/bin`, and `/bin` when they exist.


    Additional host command directories may be admitted only through an explicit

    host-runtime opt-in variable or option. Each admitted directory must be

    absolute, canonicalized, exist on the host, and be mounted read-only into

    the sandbox. Paths under the host home directory should be rejected by

    default or require a separate, clearly documented explicit opt-in.


    Nix-mode `PI_EN_BWRAP_EXTRA_PATH` semantics must remain constrained to

    validated `/nix/store` paths. Host-mode extra path semantics must be kept

    separate or guarded by explicit runtime-mode checks so Nix safety guarantees

    are not weakened accidentally.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: FS-011
  item_id: PIEN-FRQ-20260701-110516-001
  status: active
  title: Host runtime support mounts
  body: '#### FS-011 Host runtime support mounts


    Host runtime mode must mount only the host filesystem locations needed to

    execute the admitted host tools, Pi, and documented support files. Command

    directories and support directories admitted for host runtime must be

    read-only unless a requirement explicitly states otherwise.


    Host runtime mode may mount common system runtime locations needed by

    dynamically linked host binaries, such as system library, loader, share,

    certificate, and alternatives directories, when present. It must still avoid

    mounting the host home directory, SSH keys, cloud credentials, Docker

    sockets, or unrelated project trees by default.


    Nix mode must retain the existing read-only `/nix/store` behavior. Host

    mode should mount `/nix/store` only when explicitly needed for admitted host

    paths or when the selected runtime is Nix-backed.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: AGENT-017
  item_id: PIEN-FRQ-20260701-110518-001
  status: active
  title: Host Pi and role-manager source policy
  body: '#### AGENT-017 Host Pi and role-manager source policy


    Host runtime mode must define how the sandbox reaches the host `pi` command

    and optional role-manager package without mounting the host home directory

    by default.


    The default policy should support system or globally installed Pi paths that

    are already covered by host runtime read-only mounts. If `pi` resolves to a

    path under the host home directory or another unmounted custom location,

    pi-en must fail with an actionable diagnostic or require an explicit

    read-only bind opt-in.


    Role-manager auto-loading must continue to work in host mode when a safe

    package path is available from the pi-en checkout, an installed package, or

    an explicit environment variable. Paths outside the project and outside

    already mounted runtime locations must be bound read-only and rewritten to

    their in-sandbox locations before being passed to Pi.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: INSTALL-001
  item_id: PIEN-FRQ-20260701-182129-001
  status: active
  title: Support non-Nix installation
  body: "#### INSTALL-001 Non-Nix installation support\n\npi-en should provide a supported\
    \ non-Nix installation path for users who\nwant the host-runtime workflow without\
    \ entering a Nix development shell or\nconsuming a flake output. The non-Nix installer\
    \ must install the pi-en\ncommand wrappers and support files that Nix packages\
    \ normally place on\n`PATH` or expose through environment variables.\n\nThe installation\
    \ path should, at minimum, support a user-local prefix such as\n`~/.local` and\
    \ should be adaptable to a system prefix such as `/usr/local`\nwhen run with appropriate\
    \ permissions. Installed commands must be able to\nlocate their support files\
    \ without requiring the user to keep running from a\nsource checkout.\n\nInstallation\
    \ and deinstallation should not require cloning the full pi-en\nrepository. The\
    \ project may support direct checkout installation as a\ncontributor convenience,\
    \ but end-user install and uninstall flows should work\nfrom a published release\
    \ artifact, downloaded installer, or already installed\nmanifest/uninstall command.\n\
    \nInstalled support files must include the coordination helper library,\ncoordination\
    \ templates, and role-manager package data needed by:\n\n- `pi-en`, `pi-en-shell`,\
    \ and `pi-en-bwrap`;\n- `pi-en-bootstrap-coordination`;\n- `pi-en-coord-*` helper\
    \ commands;\n- `pi-en-serial-roles`.\n\nThe non-Nix installer may rely on host-provided\
    \ runtime tools such as Bash,\nBubblewrap, Git, jq, ripgrep, fd, Node, and the\
    \ host `pi` command. It must\nnot describe those tools as pinned or reproducible\
    \ by pi-en. User-facing\noutput and documentation must clearly state that Nix\
    \ remains the\nreproducible pinned runtime while the non-Nix install uses host\
    \ tools.\n\nAcceptance criteria:\n\n- A non-Nix user can install pi-en commands\
    \ and support files under a chosen\n  prefix without invoking Nix or cloning the\
    \ full pi-en repository.\n- Installed command wrappers set or otherwise resolve\
    \ the equivalent support\n  paths for `PI_EN_COORD_LIB`, `PI_EN_COORD_TEMPLATE_DIR`,\
    \ and\n  `PI_EN_ROLE_MANAGER_PACKAGE`.\n- The installer checks or documents required\
    \ host dependencies and reports\n  missing dependencies with host-runtime wording.\n\
    - An uninstall or cleanup path is documented or provided for files installed\n\
    \  by the non-Nix installer, and it can run without access to the original\n \
    \ source checkout.\n- README installation guidance distinguishes direct checkout,\
    \ non-Nix\n  installed host runtime, and Nix-backed reproducible runtime workflows.\n\
    - Existing direct-checkout and Nix flake/devshell workflows remain\n  compatible."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: INSTALL-002
  item_id: PIEN-FRQ-20260702-064100-001
  status: active
  title: Support explicit main-branch non-Nix bootstrap installation
  body: "#### INSTALL-002 Remote-ref non-Nix installer bootstrap\n\nThe non-Nix installer\
    \ should be able to run as a small bootstrap script when\nthe full pi-en payload\
    \ is not already present locally. In bootstrap mode, it\nmust fetch an explicit\
    \ pi-en source artifact, unpack it to a temporary\ndirectory, and continue installation\
    \ from that artifact using the same\ninstalled file layout as local payload installs.\n\
    \nThe bootstrap interface must support installing from the upstream `main`\nbranch\
    \ when the user explicitly requests that ref. Main-branch installation is\nmutable\
    \ and not reproducible, so it must be documented as a development or\nlatest channel\
    \ rather than the recommended stable path. Tagged release refs or\nrelease artifacts\
    \ should remain the preferred stable installation channel.\n\nThe installer should\
    \ record origin information in installed state or the\ninstall manifest when available,\
    \ including the repository, ref or version,\nartifact URL, and checksum if one\
    \ was verified. Future upgrade and uninstall\nbehavior may use this origin metadata,\
    \ but uninstall must not require network\naccess or the original source checkout.\n\
    \nAcceptance criteria:\n\n- A user can bootstrap installation without cloning\
    \ the full repository by\n  running the installer script and passing an explicit\
    \ remote ref such as\n  `--ref main`.\n- `--ref main` fetches the GitHub branch\
    \ archive or equivalent artifact for\n  the configured repository, then installs\
    \ from the fetched payload.\n- Stable documentation prefers tagged releases or\
    \ release artifacts and labels\n  `main` installation as mutable, development/latest,\
    \ and not reproducible.\n- The installer supports configurable origin inputs such\
    \ as repository and/or\n  artifact URL while preserving safe defaults for the\
    \ upstream pi-en repo.\n- The installer records origin metadata in the install\
    \ manifest or adjacent\n  installed state when the install came from a remote\
    \ artifact.\n- Bootstrap downloads use a temporary directory and clean it up after\
    \ success\n  or failure where practical.\n- Uninstall continues to work from installed\
    \ state without network access,\n  the original source checkout, or the downloaded\
    \ temporary artifact.\n- Existing local payload installation from a checkout or\
    \ release archive\n  remains compatible."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: CMD-021
  item_id: PIEN-FRQ-20260706-202632-001
  status: active
  title: pi-en-bwrap shell mode
  body: '#### CMD-021 `pi-en-bwrap` shell mode


    `pi-en-bwrap` must provide a shell mode that constructs the same Bubblewrap

    sandbox, mounts, working directory, sanitized environment, runtime tool path,

    Pi state exposure, extension/session/resource binds, and coordination path

    rewrites as normal Pi coding-agent execution, but execs Bash instead of

    `pi` as the final process.


    Shell mode must be reachable through a wrapper-owned interface, such as

    `pi-en-bwrap --shell`, and may also be exposed as `pi-en-bwrap-shell`. In normal

    Pi mode, existing argument behavior must remain unchanged, including

    `pi-en-bwrap -- <args>` passing arguments to Pi.


    Shell mode must not inject Pi default arguments, must not treat shell-mode

    arguments as Pi arguments, and must exit with the shell process status.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: CMD-022
  item_id: PIEN-FRQ-20260706-202634-001
  status: active
  title: pi-en-shell runtime launcher
  body: '#### CMD-022 `pi-en-shell` runtime launcher


    `pi-en` must expose a user-facing `pi-en-shell` command that enters a

    Bash shell inside the same sandbox profile used by the Pi coding agent while

    preserving the existing `pi-en` runtime selection contract.


    `pi-en-shell` must accept the same runtime-selection inputs as `pi-en`,

    including `--runtime host|nix|auto`, `PI_EN_RUNTIME`, and `--flake REF`.

    Host, Nix, and auto modes must resolve through the existing launcher layer

    and then delegate to `pi-en-bwrap` shell mode instead of duplicating sandbox

    policy.


    When the Nix runtime is requested and the Nix-provided commands are not

    already wired into the current process, `pi-en-shell` must enter

    `nix develop` for the selected flake and run the Nix-provided

    `pi-en-shell`, preserving the requested shell-mode arguments.


    Existing `pi-en` and `pi-en-bwrap` Pi-agent behavior must remain unchanged,

    except that `pi-start` is intentionally removed and its default startup

    behavior moves into `pi-en`.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: CMD-023
  item_id: PIEN-FRQ-20260711-092100-001
  status: active
  title: pien command namespace
  body: "#### CMD-023 `pien` command namespace\n\npi-en must provide a canonical `pien`\
    \ command namespace that covers the\ncurrent command surface without changing\
    \ existing `.pi-en/` operational\nstate paths or `PI_EN_*` environment variables.\
    \ Lower-level behavior-source\ncommands must use the `pi-en-*` names required\
    \ by CMD-026.\n\n`pien` without a subcommand must behave like the current default\
    \ `pi-en`\nlauncher, and `pien run` must be an explicit alias for the same behavior.\n\
    The namespace must expose these leaf commands:\n\n- `pien raw -- [pi args...]`\
    \ for current `pi-en --raw -- [pi args...]`;\n- `pien shell [shell args...]` for\
    \ current `pi-en-shell`;\n- `pien sandbox [pi args...]` for `pi-en-bwrap`;\n-\
    \ `pien sandbox shell [shell args...]` for `pi-en-bwrap --shell`;\n- `pien coord\
    \ bootstrap` for `pi-en-bootstrap-coordination`;\n- `pien coord init`, `clone`,\
    \ `status`, `list`, `show`, `new`, `claim`,\n  `done`, `review`, `verify`, `close`,\
    \ `pull`, `push`, `lint`, and `repo`\n  for the corresponding `pi-en-coord-*`\
    \ helpers, with `show` mapping to\n  `pi-en-coord-cat`;\n- `pien coord rules upgrade`\
    \ for `pi-en-coord-upgrade-rules`;\n- `pien coord requirements generate` for\n\
    \  `pi-en-coord-generate-requirements`;\n- `pien coord requirements coverage`\
    \ for\n  `pi-en-coord-generate-requirements-coverage`;\n- `pien roles serial`\
    \ for `pi-en-serial-roles`;\n- `pien install` and `pien uninstall` for supported\
    \ non-Nix install and\n  uninstall flows backed by `pi-en-install-non-nix` and\
    \ `pi-en-uninstall`;\n- `pien completion bash` for portable Bash completion setup.\n\
    \nThe command namespace must be available from direct checkout use,\nhost-runtime\
    \ non-Nix installation, Nix devshells, and flake app/package\noutputs."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: CMD-024
  item_id: PIEN-FRQ-20260711-092100-002
  status: active
  title: pien behavioral parity
  body: '#### CMD-024 `pien` behavioral parity


    Each `pien` replacement command must preserve the parameter handling and

    behavior of the renamed `pi-en-*` low-level command it dispatches to after

    the new subcommand path is consumed. Parity includes accepted options,

    positional arguments, argument

    ordering, exit status, stdout/stderr behavior, working-directory behavior,

    environment-variable handling, support-file resolution, and help behavior.


    The implementation should remain a thin dispatcher rather than a rewrite of

    launcher, sandbox, coordination, role-automation, or installer behavior. Leaf

    commands should `exec` the renamed low-level implementation command with

    unchanged remaining arguments. For example:


    ```bash

    pien coord status --repo-id pi-en

    # equivalent to: pi-en-coord-status --repo-id pi-en


    pien shell --runtime nix

    # equivalent to: pi-en-shell --runtime nix


    pien sandbox shell -- -l

    # equivalent to: pi-en-bwrap --shell -- -l

    ```


    Because top-level `pien` subcommand names are reserved, users must be able

    to use `pien -- ...` when they need to pass a first Pi argument that looks

    like a `pien` subcommand.


    Parity must be verified in both host and Nix runtime contexts, including

    direct checkout, non-Nix installed host runtime, Nix devshell, and flake app

    or package execution where those contexts are supported by the current

    command.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: CMD-025
  item_id: PIEN-FRQ-20260711-092100-003
  status: active
  title: pien help and Bash completion
  body: '#### CMD-025 `pien` help and Bash completion


    The `pien` namespace must provide discoverable command help and Bash

    completion for the nested command hierarchy.


    Help must support, at minimum:


    ```bash

    pien help

    pien help coord

    pien help coord status

    pien coord status --help

    ```


    Leaf help may delegate to the mapped existing command''s `--help` output.

    Group help should list available subcommands and the existing command that

    each subcommand maps to.


    Bash completion must be available as an installed completion file where the

    packaging environment supports Bash completion and as a portable command:


    ```bash

    pien completion bash

    source <(pien completion bash)

    ```


    Completion must suggest top-level commands, nested `sandbox`, `coord`,

    `coord rules`, `coord requirements`, `roles`, and `completion` subcommands,

    and known options for leaf commands. Path-valued options should keep path

    completion. The completion implementation should not require Nix-only tools;

    it must work in host-runtime installations as well as Nix-provided shells.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: CMD-026
  item_id: PIEN-FRQ-20260711-170000-001
  status: active
  title: pi-en-prefixed low-level commands
  body: "#### CMD-026 pi-en-prefixed low-level commands\n\nAll lower-level commands\
    \ that are called by the `pien` command collection\nmust use `pi-en-*` names,\
    \ without compatibility shims for the old names.\nThe supported low-level command\
    \ names are:\n\n- `pi-en`, `pi-en-shell`, `pi-en-bwrap`;\n- `pi-en-bootstrap-coordination`;\n\
    - `pi-en-coord-init`, `pi-en-coord-clone`, `pi-en-coord-status`,\n  `pi-en-coord-list`,\
    \ `pi-en-coord-cat`, `pi-en-coord-new`,\n  `pi-en-coord-claim`, `pi-en-coord-done`,\
    \ `pi-en-coord-review`,\n  `pi-en-coord-verify`, `pi-en-coord-close`, `pi-en-coord-pull`,\n\
    \  `pi-en-coord-push`, `pi-en-coord-lint`, `pi-en-coord-repo`,\n  `pi-en-coord-upgrade-rules`,\
    \ `pi-en-coord-generate-requirements`, and\n  `pi-en-coord-generate-requirements-coverage`;\n\
    - `pi-en-serial-roles`;\n- `pi-en-install-non-nix` and `pi-en-uninstall`.\n\n\
    Installed Nix packages, flake apps, non-Nix installations, direct-checkout\ndocumentation,\
    \ tests, and `pien` help/completion output must use the new\nnames. The old lower-level\
    \ commands `pi-bwrap`, `bootstrap-coordination`,\n`agent-coord-*`, `pi-serial-roles`,\
    \ and `install-non-nix` must not remain\nsupported command entrypoints after the\
    \ rename."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: CMD-027
  item_id: PIEN-FRQ-20260720-091901-001
  status: active
  title: Canonical flake agent shell integration recipe
  body: "#### CMD-027 \u2014 Canonical flake agent shell integration recipe\n\npi-en\
    \ must provide a deterministic user-facing recipe for adding an\nagent-oriented\
    \ devshell to an external project flake.\n\nThe recipe must make the pi-en-specific\
    \ intent explicit: add `pi-en` as a\nflake input, include it in `outputs`, preserve\
    \ existing project devshells,\nand add an agent shell with `pi-en.lib.mkPiShell`\
    \ rather than creating a\nproject-native shell that only happens to be named `agent`.\n\
    \nThe recipe may start as a print-only helper, but its output must be stable\n\
    enough for humans and agents to copy into common existing-flake shapes. It\nmust\
    \ document when to choose `includeCoordinationHelpers = true` and where to\ndeclare\
    \ project-specific sandbox tools with `extraPackages`.\n\nThe recipe should recommend\
    \ that pi-en-integrated projects provide the\n`.#agent` selector consistently.\
    \ If the default shell is already pi-en-aware,\nthe recipe may show `agent` as\
    \ an alias of that normal `nix develop` shell;\notherwise it should show a separate\
    \ `pi-en.lib.mkPiShell` agent shell."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: AGENT-018
  item_id: PIEN-FRQ-20260720-091904-001
  status: active
  title: Packaged flake integration skill
  body: "#### AGENT-018 \u2014 Packaged flake integration skill\n\npi-en must provide\
    \ agent-facing guidance for modifying external flakes to\nadd pi-en-aware development\
    \ shells.\n\nThe skill must teach agents that a request such as \"make `nix develop\n\
    .#agent` work for pi-en\" means adding the pi-en flake input and using\n`pi-en.lib.mkPiShell`,\
    \ unless the user explicitly asks for a normal\nproject-native shell. It must\
    \ instruct agents to preserve existing flake\nstructure, existing devshells, project\
    \ package outputs, and project-specific\nshell policy.\n\nThe skill must prefer\
    \ the canonical recipe helper from CMD-027 when\navailable, and must warn against\
    \ satisfying the request by creating an\nunrelated `agentProfile` or `devShells.agent`\
    \ that lacks `pien` and the\npi-en sandbox/runtime wiring.\n\nThe skill must also\
    \ teach `.#agent` as the preferred shell selector for\npi-en-integrated projects,\
    \ including the compatibility pattern where\n`agent` aliases the normal default\
    \ shell when that shell is already\npi-en-aware."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: RUNTIME-006
  item_id: PIEN-FRQ-20260720-094621-001
  status: active
  title: Nix runtime agent devshell selection
  body: "#### RUNTIME-006 \u2014 Nix runtime agent devshell selection\n\nWhen `pien\
    \ --runtime nix`, `pi-en --runtime nix`, or `pi-en-shell\n--runtime nix` enters\
    \ a target project flake, pi-en should prefer a\npi-en-aware agent devshell when\
    \ the project provides one.\n\nThe preferred convention is `devShells.<system>.agent`,\
    \ selected by the flake\nreference fragment `.#agent`. If that shell exists, Nix\
    \ runtime startup should\nenter it instead of the default devshell so `pien` uses\
    \ the project-declared\nagent shell, runtime wiring, extra packages, and optional\
    \ coordination\nhelpers.\n\nFor backward compatibility, projects may define `.#agent`\
    \ as an alias of\ntheir normal default shell when no separate agent policy is\
    \ needed. pi-en\nmust not require the alias for older flakes: if no agent devshell\
    \ exists, Nix\nruntime startup must continue to use the existing default `nix\
    \ develop`\nbehavior.\n\npi-en must not silently fall back to the default devshell\
    \ when an explicitly\nselected or discovered `.#agent` shell exists but fails\
    \ to evaluate or build;\nthat failure is actionable project configuration feedback\
    \ and should be\nreported.\n\nThe runtime should also provide an explicit selector\
    \ override, such as a\n`--devshell NAME` command-line option and `PI_EN_NIX_DEVSHELL=NAME`,\
    \ so\nusers can force `agent`, `default`, or another project shell without relying\n\
    on automatic discovery. Command-line selection must take precedence over the\n\
    environment variable."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: CMD-028
  item_id: PIEN-FRQ-20260725-125507-001
  status: active
  title: Sandbox-aware pien command surface
  body: "#### CMD-028 \u2014 Sandbox-aware pien command surface\n\npi-en should expose\
    \ a small, sandbox-aware `pien` command surface inside\nPi sessions so humans\
    \ and agents can discover and run coordination and\ndiagnostic helpers from the\
    \ same working directory and with the same command\nnames.\n\nThe in-Pi command\
    \ surface must preserve the runtime boundary: commands that\nselect or enter runtimes,\
    \ start Pi, open nested sandbox shells, or install and\nuninstall pi-en remain\
    \ outer-launcher operations. Inside Pi they should fail\nwith a clear diagnostic\
    \ that explains the command is terminal-only and shows\nthe equivalent command\
    \ to run outside Pi when practical.\n\nThe supported in-Pi subset should include\
    \ non-launcher diagnostics and\ndocumentation helpers, such as help/version/recipe\
    \ commands, and coordination\nhelpers that operate on the mounted implementation\
    \ checkout and coordination\nclone. Coordination commands may remain subject to\
    \ the existing sandbox\nfilesystem, network, and authentication policy; failures\
    \ caused by missing\nSSH keys or host home credentials should be explicit and\
    \ documented rather\nthan worked around by broadening sandbox mounts.\n\npi-en\
    \ should detect the in-sandbox context through an explicit marker set by\nthe\
    \ sandbox layer, not by guessing from paths. The marker lets the canonical\n`pien`\
    \ namespace apply a safe allow/block policy while preserving current\nbehavior\
    \ in outer terminals, Nix devshells, direct checkouts, and profile or\nnon-Nix\
    \ installs."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: INSTALL-003
  item_id: PIEN-FRQ-20260809-181859-001
  status: active
  title: Support Git URL non-Nix install and update
  body: "#### INSTALL-003 Git URL install and update support\n\nThe non-Nix installer\
    \ should support explicit installation from arbitrary\nlocal or remote Git repositories,\
    \ not only GitHub codeload archives. Users\nshould be able to pass `--url URL\
    \ --ref REF` where `URL` is a local checkout\npath, `file://` URL, HTTPS Git URL,\
    \ SSH Git URL, or scp-like Git remote, and\n`REF` names one of these forms:\n\n\
    - a branch name, such as `main`;\n- a tag name, such as `v0.2.0`;\n- a pinned\
    \ commit constrained to a branch, expressed as `COMMIT@BRANCH`.\n\nBranch and\
    \ tag names are mutable unless governed externally, so the installer\nmust record\
    \ the requested ref and the resolved commit in installed origin\nmetadata. For\
    \ `COMMIT@BRANCH`, the installer should verify that the commit is\nreachable from\
    \ the named branch before installing. If an unqualified `REF`\nresolves to both\
    \ a branch and a tag, the installer should fail with an\nambiguity diagnostic\
    \ rather than guessing.\n\nExplicit Git source inputs should take precedence over\
    \ local payload\ndiscovery. This allows an installed `pi-en-update` wrapper, which\
    \ runs from\n`$PREFIX/share/pi-en/scripts`, to fetch the stored origin instead\
    \ of\naccidentally reinstalling the already-installed payload as if it were a\
    \ local\nsource checkout.\n\nThe installer should keep the existing archive/bootstrap\
    \ path for backwards\ncompatibility, including `--repo OWNER/REPO` and `--artifact-url\
    \ URL`, but\n`--url URL --ref REF` should be the preferred future interface for\
    \ arbitrary\nrepositories and updater-driven installs.\n\nInstalled state should\
    \ include enough origin data for a generated\n`pi-en-update` wrapper to rerun\
    \ the installer without requiring the user to\nremember the original URL and ref.\
    \ The wrapper should reuse stored values\nwhen the caller does not pass replacements\
    \ and should allow explicit\n`--url`, `--ref`, or archive override options for\
    \ one-off migrations.\n\nAcceptance criteria:\n\n- `pi-en-install-non-nix --url\
    \ URL --ref REF --prefix PREFIX` installs from\n  local Git repositories and from\
    \ remote Git URLs using a temporary clone or\n  worktree when needed.\n- Plain\
    \ `REF` values resolve safely as branch or tag names, with ambiguous\n  branch/tag\
    \ names rejected unless the user chooses a non-ambiguous input.\n- `COMMIT@BRANCH`\
    \ installs exactly the requested commit only after verifying\n  it is reachable\
    \ from the requested branch.\n- Installed origin metadata records source type,\
    \ normalized URL, requested\n  ref, resolved ref type, resolved commit, and any\
    \ compatibility archive\n  inputs that were used.\n- Re-running installation through\
    \ `pi-en-update` reuses stored URL/ref values\n  when the caller does not pass\
    \ replacements and writes refreshed origin\n  metadata after a successful install.\n\
    - The install manifest lists origin metadata and the generated update wrapper\n\
    \  so uninstall removes both from installed state.\n- Documentation distinguishes\
    \ trusted-code installation, mutable branch\n  updates, pinned `COMMIT@BRANCH`\
    \ installs, archive compatibility, and the\n  host-runtime/non-pinned nature of\
    \ non-Nix installs.\n- Existing direct-checkout local installs, GitHub archive\
    \ bootstrap installs,\n  manifest-backed uninstall, and Nix workflows remain compatible."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: RUNTIME-007
  item_id: PIEN-FRQ-20260810-165351-001
  status: active
  title: Support Nix-shell Pi-en flake input updates
  body: "#### RUNTIME-007 Nix-shell Pi-en flake input update support\n\nPi-en-enabled\
    \ Nix shells created with `pi-en.lib.mkPiShell` should provide a\nshell-local\
    \ `pi-en-update` command for updating the consuming project's\n`pi-en` flake input.\
    \ This command is distinct from the non-Nix installed\nupdater even though it\
    \ intentionally uses the same command name: normal Nix\nshell `PATH` precedence\
    \ should make the Nix-store command available inside\nthe shell, while locally\
    \ installed prefixes continue to provide the non-Nix\nupdater outside the shell.\n\
    \nThe Nix-shell updater should accept only source selector options:\n\n- `--url\
    \ URL` to replace or set the base `pi-en` flake input URL;\n- `--ref REF` to select\
    \ a branch, tag, or `COMMIT@BRANCH` pin;\n- `-h` / `--help` for command help.\n\
    \nIt must not accept non-Nix installer options such as `--prefix`, `--repo`,\n\
    `--artifact-url`, or `--check-deps`. Omitted source parts must remain\nunchanged:\
    \ without `--url`, keep the existing base URL; without `--ref`, keep\nthe existing\
    \ ref/rev selector when present. When neither `--url` nor `--ref`\nis supplied,\
    \ the command should leave `flake.nix` unchanged and refresh the\ncurrent `pi-en`\
    \ lock input. When at least one source option is supplied, the\ncommand should\
    \ also refresh the `pi-en` lock input even if the computed flake\nURL is unchanged,\
    \ because mutable branch or repository inputs may need to\nadvance to a newer\
    \ commit. Updating tag or commit-pinned inputs may be\nredundant but is harmless.\n\
    \nThe command should run only from an active Pi-en-enabled Nix shell. The shell\n\
    should export an explicit marker, such as `PI_EN_NIX_SHELL=1`, plus the input\n\
    name to update, defaulting to `pi-en`. If invoked without that marker, the\nNix-store\
    \ updater should fail clearly instead of editing arbitrary projects.\n\nFor common\
    \ flakes, the updater should locate the project root containing\n`flake.nix`,\
    \ inspect the current `pi-en` input, update that input when\n`--url` or `--ref`\
    \ changes the requested source, and refresh `flake.lock` for\nthat input. Supported\
    \ textual forms should include at least direct input URL\nassignments such as\
    \ `pi-en.url = \"...\";`, `inputs.pi-en.url = \"...\";`, and\n`\"pi-en\".url =\
    \ \"...\";`. Complex or dynamically generated inputs should fail\nsafely with\
    \ manual-edit guidance rather than guessed rewrites.\n\nRef handling should match\
    \ the Git-source installer mental model. A plain\nbranch or tag ref may be represented\
    \ with a Nix flake URL form appropriate to\nthe base URL. A `COMMIT@BRANCH` ref\
    \ should become a Nix Git URL containing\nboth the branch and revision, for example\n\
    `git+https://github.com/u2up/pi-en.git?ref=BRANCH&rev=COMMIT`, so the user\ngets\
    \ the same URL/ref CLI semantics across Nix-shell and non-Nix update\nworkflows\
    \ while Nix receives a reproducible pinned revision.\n\n`pien update` should use\
    \ the context-appropriate updater. Inside a\nPi-en-enabled Nix shell, it should\
    \ resolve and run the Nix-shell\n`pi-en-update` from `PATH`. Outside that shell,\
    \ it should continue to use the\nnon-Nix installed updater or the existing direct-checkout\
    \ fallback behavior.\nThe sandbox policy should remain unchanged: mutating update\
    \ commands are for\nthe outer terminal or devshell, not Pi's Bubblewrap sandbox.\n\
    \nAcceptance criteria:\n\n- `pi-en.lib.mkPiShell` exposes a Nix-store `pi-en-update`\
    \ only in\n  Pi-en-enabled Nix shells and marks the shell so the tool can detect\
    \ its\n  intended context.\n- Nix-shell `pi-en-update --help` documents only `--url`,\
    \ `--ref`, and help\n  options, and rejects non-Nix installer options.\n- The\
    \ updater locates the consuming project flake, rewrites supported\n  `pi-en` input\
    \ URL assignment forms when `--url` or `--ref` changes the\n  requested source,\
    \ and fails safely for unsupported dynamic forms.\n- `COMMIT@BRANCH` refs are\
    \ converted to Nix Git flake URLs with both\n  `ref=BRANCH` and `rev=COMMIT`.\n\
    - With no source options, after any required `flake.nix` edit, or after an\n \
    \ explicit source option computes to the current URL, the updater refreshes\n\
    \  only the `pi-en` input lock using the supported Nix command for the\n  project's\
    \ Nix version.\n- `pien update` delegates to the Nix-shell updater inside `mkPiShell`\
    \ and to\n  the non-Nix installed updater outside Nix shell contexts.\n- Documentation\
    \ explains the two context-specific `pi-en-update` meanings,\n  PATH precedence,\
    \ supported flake forms, `COMMIT@BRANCH` mapping, and the\n  trusted-source/pinning\
    \ implications."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: BHV-001
  item_id: PIEN-FRQ-20261024-215014-001
  status: active
  title: Project-owned behavior command and file contracts
  body: "#### BHV-001 \u2014 Project-owned behavior command and file contracts\n\n\
    pi-en must provide project-owned Behavior Specifications (BHVs) as tracked\nsource\
    \ artifacts. The canonical behavior root is\n`pi-en-behaviors/`, which is separate\
    \ from ignored mutable `.pi-en/` state\nand must not be added to coordination\
    \ item directories or coordination\nlifecycle commands.\n\nThe behavior namespace\
    \ is a sibling of `pien coord` and exposes `init`,\n`new`, `list`, `regroup`,\
    \ `index`, `lint`, `test`, `coverage`, and\n`requirements snapshot`. The generic\
    \ tooling must resolve its manifest from\nan explicit or discovered project\n\
    root and support ordinary project CI without a coordination checkout.\n\n`MANIFEST.yaml`\
    \ must declare the v1 schema, repository ID, local item key,\nglossary, project\
    \ adapter, optional requirements snapshot, and advisory or\nenforced compliance\
    \ mode. Local BHV IDs use\n`<ITEMKEY>-BHV-<YYYYMMDD-HHMMSS>-<NNN>` and are not\
    \ coordination item IDs.\n\nCoordination requirements and issues may reference\
    \ BHV IDs, but\ncoordination stores neither BHV bodies nor their lifecycle.\n\n\
    `init` must be additive and non-destructive: it must not rewrite an existing\n\
    manifest, glossary, or BHV. An implementation repository commits and owns\nits\
    \ BHVs, adapter, fixtures, and CI configuration; it may pin the pi-en\nrunner\
    \ version for reproducible CI. BHV execution needs no coordination\ncheckout.\
    \ A runner must either support a BHV's declared schema and glossary\nlanguage\
    \ version or fail clearly and locally with an upgrade/migration\nindication; it\
    \ must not guess or silently reinterpret the specification."
  applicable_repos:
  - pi-en
  behavior_coverage: required
- requirement_key: BHV-002
  item_id: PIEN-FRQ-20261024-215016-001
  status: active
  title: Versioned behavior DSL and adapter model
  body: "#### BHV-002 \u2014 Versioned behavior DSL and adapter model\n\nBHVs, manifests,\
    \ and glossaries use versioned YAML schemas parsed by a real\nYAML parser bundled\
    \ with or explicitly verified by the behavior command.\nComplex scenario data\
    \ must not be parsed with grep or awk, and DSL values\nmust never be evaluated\
    \ as shell syntax.\n\nEach repository owns a versioned domain glossary that declares\
    \ its nouns,\nvalue types, given/when/then terms, accepted argument shapes, logical\
    \ BHV\ngroup taxonomy, and any\ndeprecated aliases in domain language. A BHV declares\
    \ its glossary version,\nactive/deprecated/superseded status, `satisfies` requirement\
    \ keys, and one or\nmore contrasting scenarios. It must not contain shell snippets\
    \ or\nimplementation-private assertions.\n\nThe generic runner invokes the manifest's\
    \ executable project adapter as\n`given`, `when`, or `then`, passing a term, JSON\
    \ input file, and state\ndirectory. The adapter must implement `describe`; lint\
    \ compares that output\nwith the glossary so every declared executable term is\
    \ implemented and term\narguments are validated before execution.\n\nBHVs are\
    \ executable acceptance examples: their feature, rule, and scenario\nlanguage\
    \ must describe public domain or user-visible outcomes rather than\nimplementation\
    \ structure. They define conformance only for their stated\nobservables; they\
    \ do not prove complete behavioral equivalence or replace\nunit, security, property,\
    \ performance, or other appropriate tests. A\nscaffold or recorded interaction\
    \ may assist authoring, but it is not an\naccepted BHV until a human reviews its\
    \ domain meaning and intended outcome."
  applicable_repos:
  - pi-en
  behavior_coverage: required
- requirement_key: BHV-005
  item_id: PIEN-FRQ-20261025-054332-001
  status: active
  title: Project-local BDD adoption and interpretation
  body: "#### BHV-005 \u2014 Project-local BDD adoption and interpretation\n\npi-en\
    \ must document BHVs as project-local, executable acceptance examples.\nAn implementation\
    \ repository owns and commits its behavior root, glossary,\nadapter, fixtures,\
    \ and pin or integration of the behavior runner. Git\nhistory preserves changed\
    \ and removed specifications; current BHV status\nonly determines what is normative\
    \ in the checked-out suite.\n\nThe adoption workflow must be additive: initialize\
    \ a behavior root, define\ndomain terms and logical groups, implement a public-interface\
    \ adapter, add a\nsmall reviewed\nbehavior slice, and run lint/test in ordinary\
    \ CI. Requirements snapshots and\ncoverage are optional rather than prerequisites.\
    \ Existing projects may begin\nwith characterization examples derived from known-good\
    \ observable behavior,\nbut those examples must be reviewed before being treated\
    \ as intended\nacceptance behavior.\n\nDocumentation must distinguish this limited\
    \ behavioral contract from proof\nof complete reimplementation equivalence and\
    \ explain that complementary test\ntechniques remain necessary."
  applicable_repos:
  - pi-en
  behavior_coverage: not-applicable
- requirement_key: BHV-006
  item_id: PIEN-FRQ-20261025-072024-001
  status: active
  title: Logical behavior grouping and catalog discovery
  body: "#### BHV-006 \u2014 Logical behavior grouping and catalog discovery\n\nA\
    \ behavior root keeps reserved control files at its top level and stores BHV\n\
    files as ID-named regular YAML files directly in `specifications/`. The\nrunner\
    \ discovers only that collection, rejects unexpected YAML files there,\nand rejects\
    \ duplicate BHV IDs across active, deprecated, and superseded\nspecifications.\
    \ Filesystem layout is deliberately not a behavior taxonomy.\n\nEach BHV must\
    \ declare one normalized slash-separated logical `group` such as\n`features/coordination/item-lifecycle`,\
    \ plus its title, feature, rule, and\noptional secondary tags. Group segments\
    \ must be non-empty portable slugs and\nmust reject leading/trailing slashes,\
    \ `.`, `..`, and path traversal. Groups\ndescribe externally meaningful capabilities\
    \ rather than implementation\nmodules. The immutable BHV ID remains the only cross-file\
    \ and\ncross-repository reference identity.\n\n`pien behavior list --group GROUP`\
    \ and `test --group GROUP` must support\nsegment-aware descendant selection; `new\
    \ --group GROUP` scaffolds the\nmetadata; and `regroup` changes only group metadata,\
    \ never IDs or references.\n`pien behavior index` generates a catalog containing\
    \ ID, group, title,\nfeature, rule, status, tags, requirements, and scenario count.\
    \ The catalog\nis derived output, not a hand-maintained source of truth."
  applicable_repos:
  - pi-en
  behavior_coverage: required
