- requirement_key: CRQ-009
  item_id: PIEN-CRQ-20260612-210000-009
  status: active
  title: Enabled Pi tools are not inherently harmless
  body: "#### CRQ-009 \u2014 Enabled Pi tools are not inherently harmless\n\n- Type:\
    \ Constraint requirement\n- Requirement kind: limitation\n- Related workflows:\
    \ UC-014, UC-022\n\nIf `read` or `bash` tools are enabled, copied auth files,\
    \ exposed global extensions/packages, and bound project sessions may be readable\
    \ by commands or tools inside the sandbox. Users should use least-privilege API\
    \ keys, provider proxies, reduced tool allowlists, or `PI_EN_BWRAP_NET=0` when\
    \ appropriate."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: CRQ-010
  item_id: PIEN-CRQ-20260613-090617-001
  status: active
  title: Requirement source of truth precedence
  body: "#### CRQ-010 \u2014 Requirement source of truth precedence\n\n- Type: Constraint\
    \ requirement\n- Requirement kind: architecture boundary\n\nRequirement coordination\
    \ items under root `requirements/` are the preferred\nauthoritative source of\
    \ truth for functional, quality, and constraint\nrequirements when those items\
    \ exist. Requirement changes for covered\nareas must be planned and recorded in\
    \ those items first, including\nstable `requirement_key`, classification, relationships,\
    \ testability\nmetadata, and renderable Markdown body text.\n\n`REQUIREMENTS.md`\
    \ is normally a generated, human-readable reference\nrendered from active requirement\
    \ items. Do not make requirement changes by\nediting `REQUIREMENTS.md` first when\
    \ a corresponding requirement item exists.\nUpdate the source requirement item\
    \ first, then regenerate `REQUIREMENTS.md`\nwith the requirements generator. When\
    \ requirement coordination items do not\nyet exist for a project or requirement\
    \ area, `REQUIREMENTS.md` may serve as\nthe secondary source of truth until corresponding\
    \ coordination items are\ncreated. Once items exist, any generated documentation\
    \ drift must be resolved\nby correcting the relevant coordination items or the\
    \ requirements generator,\nthen regenerating the document."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: CRQ-011
  item_id: PIEN-CRQ-20260613-183419-001
  status: active
  title: Keep pi-en launcher as a thin bootstrapper
  body: "#### CRQ-011 pi-en launcher layering constraint\n\nThe `pi-en` launcher must\
    \ remain a thin runtime/bootstrapper and must not\nduplicate sandbox policy. It\
    \ may own default Pi startup policy so the separate\n`pi-start` command can be\
    \ removed.\n\nRequired layering:\n\n```text\npi-en       = direct/project-integrated\
    \ UX entrypoint, Nix bootstrap,\n               and default Pi invocation policy\n\
    pi-en-shell = shell-oriented UX entrypoint using the same runtime selection\n\
    pi-en-bwrap     = sandbox boundary and custom Pi argument passthrough\n```\n\n\
    Consequences:\n\n- `pi-en` must implement default startup policy by adding the\
    \ default tool\n  allowlist, `--continue`, role-manager default loading, and caller-provided\n\
    \  Pi arguments before delegating to `pi-en-bwrap`.\n- `pi-en --raw` must delegate\
    \ custom runs to `pi-en-bwrap`.\n- `pi-en-shell` must delegate shell runs to `pi-en-bwrap\
    \ --shell`.\n- Project root mapping, sandbox mounts, auth/session import, and\
    \ environment\n  policy must remain owned by `pi-en-bwrap`.\n- `pi-en` must not\
    \ create, claim, mark done, review, verify, close,\n  commit, push, or otherwise\
    \ mutate coordination state automatically.\n- `pi-en` must preserve the caller's\
    \ working directory instead of\n  changing into the `pi-en` checkout, so target-project\
    \ detection stays\n  correct."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: CRQ-012
  item_id: PIEN-CRQ-20260614-180308-001
  status: active
  title: Only expose explicit Nix-store extra PATH entries
  body: '#### CRQ-012 Extra PATH entries are explicit Nix-store paths


    `pi-en-bwrap` must not discover project build tools by scanning all of

    `/nix/store`, inheriting the host `PATH`, or mounting host `/bin` or

    `/usr/bin` read-only.


    Extra command directories admitted into the sandbox `PATH` must come from

    an explicit pi-en input such as `PI_EN_BWRAP_EXTRA_PATH` or from

    `mkPiShell`-derived `extraPackages`. Each admitted path must be

    canonicalized and constrained to `/nix/store` by default. Empty path

    components may be ignored, but unsafe path components such as `/home/*`,

    `/tmp/*`, project-writable directories, host `/bin`, host `/usr/bin`, or

    relative paths must be rejected rather than silently accepted.


    This constraint preserves the pi-en security and reproducibility model:

    project-specific tools may be made available, but only as explicit,

    immutable Nix-store tool paths already covered by the read-only

    `/nix/store` mount.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: CRQ-013
  item_id: PIEN-CRQ-20260615-175840-001
  status: active
  title: Single-clone serial execution boundary
  body: '#### CRQ-013 Single-clone serial execution boundary


    The first automation implementation must operate serially over one project

    working tree and one coordination working tree. It must not introduce

    parallel role execution, tmux orchestration, reviewer/tester leases, or

    shared-clone concurrent Git operations.


    The implementation must fail closed when the project working tree is dirty

    before polling or when either working tree is dirty after a role job. During

    idle pre-selection polling only, a dirty coordination checkout may be treated

    as a temporary busy condition, but the implementation must not pull, inspect,

    select, claim, auto-reset, auto-stash, force-push, rewrite coordination

    history, or hide uncommitted source changes in order to keep polling.


    Later parallel automation must be designed as a separate phase using

    separate clones or worktrees and explicit coordination leases where needed.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: CRQ-014
  item_id: PIEN-CRQ-20260701-110520-001
  status: active
  title: Host runtime disclosure boundary
  body: '#### CRQ-014 Host runtime disclosure boundary


    Host runtime mode trades reproducible Nix-pinned tools for lower startup

    friction. Documentation and diagnostics must not describe host runtime as

    reproducible or version-pinned by pi-en.


    The product messaging must distinguish three properties:


    - Bubblewrap sandboxing remains enabled by default.

    - Host runtime mode uses unpinned host tools and dependencies.

    - Nix runtime mode provides the pinned reproducible toolset.


    Host runtime support must not weaken the default no-host-home and no-secret

    mount guarantees. Any opt-in that admits host paths under `$HOME`, custom

    language-manager installations, or other sensitive locations must be

    explicit and documented as a broader trust decision.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: CRQ-015
  item_id: PIEN-CRQ-20260711-092100-001
  status: active
  title: Keep pi-en internal state names stable
  body: '#### CRQ-015 Stable internal pi-en state and environment names


    Introducing the `pien` user-facing command namespace must not rename or

    migrate existing `.pi-en/` operational state paths, coordination attachment

    files, support-file layout under `share/pi-en`, or `PI_EN_*` environment

    variables.


    The low-level command rename to `pi-en-*` names is a binary, package,

    and documentation migration only. Any later proposal to rename internal

    state paths, environment variables, support-file layout, package metadata,

    or repository naming must be handled as a separate compatibility and

    migration decision.


    Documentation for the new command namespace must continue to describe

    `.pi-en/` and `PI_EN_*` names accurately where they are the actual storage

    paths or configuration interfaces.'
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: UC-001
  item_id: PIEN-FRQ-20260612-210000-001
  status: active
  title: Run Pi in the current repository
  body: "#### UC-001 \u2014 Run Pi in the current repository\n\n- Type: Functional\
    \ requirement\n- Requirement kind: workflow\n- Related requirements: FLAKE-006,\
    \ CMD-003, CMD-005, CMD-018, PATH-001, PATH-004, PATH-005, AGENT-011\n\nA user\
    \ must be able to enter the `pi-en` development shell and run Pi for the current\
    \ repository:\n\n```bash\nnix develop\npi-en\n```\n\nDefault `pi-en` startup must\
    \ start Pi through Bubblewrap with the default built-in tool allowlist:\n\n```text\n\
    read,bash,edit,write,grep,find,ls\n```\n\nDefault `pi-en` startup must run Pi\
    \ with `--continue` so existing scoped sessions for the current project can be\
    \ resumed."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: UC-002
  item_id: PIEN-FRQ-20260612-210000-002
  status: active
  title: Run Pi with custom arguments
  body: "#### UC-002 \u2014 Run Pi with custom arguments\n\n- Type: Functional requirement\n\
    - Requirement kind: workflow\n- Related requirements: CMD-001, CMD-004, CMD-006,\
    \ CMD-007\n\nA user must be able to invoke `pi-en-bwrap` directly when they want\
    \ to pass custom Pi arguments instead of the default startup arguments:\n\n```bash\n\
    pi-en-bwrap -- --model anthropic/claude-sonnet-4-5 \"Inspect this repo\"\n```\n\
    \nIf no arguments are supplied, `pi-en-bwrap` must default to the invocation in\
    \ CMD-004. `pi-en-bwrap --help` must show launcher help. `pi-en-bwrap -- --help`\
    \ must pass `--help` to Pi itself."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: UC-003
  item_id: PIEN-FRQ-20260612-210000-003
  status: active
  title: Use a reproducible Pi runtime shell
  body: "#### UC-003 \u2014 Use a reproducible Pi runtime shell\n\n- Type: Functional\
    \ requirement\n- Requirement kind: workflow\n- Related requirements: FLAKE-006,\
    \ RUNTIME-001, RUNTIME-002\n\nInside `nix develop`, `pi-en` must provide a reproducible\
    \ toolset on `PATH`, including Bash and core GNU utilities, Bubblewrap, Git, Node.js,\
    \ ripgrep, fd, jq, tar, gzip, find, grep, sed, awk, and CA certificates."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: UC-004
  item_id: PIEN-FRQ-20260612-210000-004
  status: active
  title: Run Pi inside a filesystem sandbox
  body: "#### UC-004 \u2014 Run Pi inside a filesystem sandbox\n\n- Type: Functional\
    \ requirement\n- Requirement kind: workflow\n- Related requirements: PATH-004,\
    \ FS-001, FS-007, FS-008, FS-010, ENV-001, ENV-003, NET-001\n\nA user must be\
    \ able to run Pi with access to the current project but without exposing the whole\
    \ host home directory. By default the sandbox mounts the selected project read-write\
    \ at `/workspace`, uses an isolated sandbox home at `/home/pi`, mounts `/nix/store`\
    \ read-only, exposes global npm Pi install paths read-only when present, avoids\
    \ sensitive host mounts, clears the environment, and shares the host network unless\
    \ disabled."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: UC-005
  item_id: PIEN-FRQ-20260612-210000-005
  status: active
  title: Select what project Pi can see
  body: "#### UC-005 \u2014 Select what project Pi can see\n\n- Type: Functional requirement\n\
    - Requirement kind: workflow\n- Related requirements: PATH-001, PATH-002, PATH-003,\
    \ PATH-004, PATH-005\n\nA user must be able to control which project root is exposed\
    \ in the sandbox. The default selection is the Git repository root when detected,\
    \ falling back to the current working directory. Users must be able to disable\
    \ Git-root detection with `PI_EN_BWRAP_USE_GIT_ROOT=0` and provide an explicit\
    \ project root with `PI_EN_BWRAP_PROJECT_ROOT=/path/to/repo`."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: UC-006
  item_id: PIEN-FRQ-20260612-210000-006
  status: active
  title: Keep per-project sandbox state
  body: "#### UC-006 \u2014 Keep per-project sandbox state\n\n- Type: Functional requirement\n\
    - Requirement kind: workflow\n- Related requirements: FS-002, FS-003, FS-005,\
    \ FS-006\n\nBy default, `pi-en` must store persistent sandbox state outside the\n\
    project under `$XDG_STATE_HOME/pi-en/<project-hash>` or\n`$HOME/.local/state/pi-en/<project-hash>`\
    \ because that state may contain\ncopied model auth, sandbox Pi settings, sessions,\
    \ imported common agent\nresources, and caches. Users must be able to override\
    \ the state directory\nwith `PI_EN_BWRAP_STATE_DIR=/path/to/state`, including\
    \ an explicit opt-in\nproject-local value such as `PI_EN_BWRAP_STATE_DIR=$PWD/.pi-en/state`."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: UC-007
  item_id: PIEN-FRQ-20260612-210000-007
  status: active
  title: Run with an ephemeral sandbox home
  body: "#### UC-007 \u2014 Run with an ephemeral sandbox home\n\n- Type: Functional\
    \ requirement\n- Requirement kind: workflow\n- Related requirements: FS-004, AGENT-011,\
    \ AGENT-012\n\nA user must be able to request disposable sandbox state with `PI_EN_BWRAP_EPHEMERAL_HOME=1`.\
    \ Project session import must be disabled by default for ephemeral homes unless\
    \ explicitly enabled."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: UC-008
  item_id: PIEN-FRQ-20260612-210000-008
  status: active
  title: Import Pi model authentication into the sandbox
  body: "#### UC-008 \u2014 Import Pi model authentication into the sandbox\n\n- Type:\
    \ Functional requirement\n- Requirement kind: workflow\n- Related requirements:\
    \ AGENT-002, AGENT-007, AGENT-008, AGENT-009, FS-006\n\nBy default, `pi-en-bwrap`\
    \ must copy only selected Pi auth/model files from the host Pi agent directory\
    \ into sandbox state: `auth.json` and `models.json`. Users must be able to disable\
    \ this behavior with `PI_EN_BWRAP_IMPORT_AUTH=0` and copy only missing files with\
    \ `PI_EN_BWRAP_AUTH_SYNC=missing`."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: UC-009
  item_id: PIEN-FRQ-20260612-210000-009
  status: active
  title: Resume only the current project's Pi sessions
  body: "#### UC-009 \u2014 Resume only the current project's Pi sessions\n\n- Type:\
    \ Functional requirement\n- Requirement kind: workflow\n- Related requirements:\
    \ AGENT-011, AGENT-012, AGENT-013, AGENT-014, AGENT-015\n\nFor persistent homes,\
    \ `pi-en` must bind-mount only the Pi session directory corresponding to the current\
    \ working directory/project path. Users must be able to disable session import\
    \ with `PI_EN_BWRAP_IMPORT_SESSIONS=0` and enable it explicitly, including for\
    \ ephemeral homes, with `PI_EN_BWRAP_IMPORT_SESSIONS=1`."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: UC-010
  item_id: PIEN-FRQ-20260612-210000-010
  status: active
  title: Use common Pi rules, skills, prompts, and roles
  body: "#### UC-010 \u2014 Use common Pi rules, skills, prompts, and roles\n\n- Type:\
    \ Functional requirement\n- Requirement kind: workflow\n- Related requirements:\
    \ AGENT-002, AGENT-003, AGENT-004, AGENT-005, AGENT-006\n\n`pi-en` must support\
    \ importing common user-owned Pi resources into the sandbox agent directory. Only\
    \ `AGENTS.md`, `CLAUDE.md`, `SYSTEM.md`, `APPEND_SYSTEM.md`, `skills/`, `prompts/`,\
    \ and `roles/` may be imported as common resources. Users must be able to set\
    \ `PI_EN_BWRAP_COMMON_AGENT_DIR`, disable import with `PI_EN_BWRAP_IMPORT_COMMON=0`,\
    \ and use `PI_EN_BWRAP_COMMON_SYNC=missing`."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: UC-011
  item_id: PIEN-FRQ-20260612-210000-011
  status: active
  title: Combine common and project-specific Pi behavior
  body: "#### UC-011 \u2014 Combine common and project-specific Pi behavior\n\n- Type:\
    \ Functional requirement\n- Requirement kind: workflow\n- Related requirements:\
    \ PATH-004, AGENT-004, AGENT-010, AGENT-010a\n\nA user must be able to combine\
    \ common personal/team rules, skills, prompts, and roles outside the project with\
    \ project-specific Pi resources committed inside the project. Pi must be able\
    \ to load imported common/global resources from `/home/pi/.pi/agent` and discover\
    \ project-specific resources from `/workspace`."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: UC-012
  item_id: PIEN-FRQ-20260612-210000-012
  status: active
  title: Use Pi extensions and packages
  body: "#### UC-012 \u2014 Use Pi extensions and packages\n\n- Type: Functional requirement\n\
    - Requirement kind: workflow\n- Related requirements: AGENT-010, AGENT-010a, AGENT-010b,\
    \ CMD-003, CMD-004, CMD-005\n\nProject-local extensions and project-installed\
    \ packages under `.pi/` must be available through `/workspace`. Global Pi extensions\
    \ and globally installed Pi packages from the host Pi agent directory must be\
    \ exposed by default according to AGENT-010. Users must be able to disable global\
    \ extension/package import with `PI_EN_BWRAP_IMPORT_EXTENSIONS=0`."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: UC-013
  item_id: PIEN-FRQ-20260612-210000-013
  status: active
  title: Use host Git preferences without exposing credentials
  body: "#### UC-013 \u2014 Use host Git preferences without exposing credentials\n\
    \n- Type: Functional requirement\n- Requirement kind: workflow\n- Related requirements:\
    \ GIT-001, GIT-002, GIT-003, GIT-004, GIT-005, GIT-006, GIT-007, GIT-008\n\n`pi-en`\
    \ must copy host Git configuration into the sandbox by default so Git commands\
    \ use normal identity, aliases, default branch names, and diff preferences. Git\
    \ credentials, SSH keys, signing keys, credential-helper stores, and referenced\
    \ secret files must not be imported automatically. Users must be able to disable\
    \ Git config import and override config source paths."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: UC-014
  item_id: PIEN-FRQ-20260612-210000-014
  status: active
  title: Customize Pi tool access
  body: "#### UC-014 \u2014 Customize Pi tool access\n\n- Type: Functional requirement\n\
    - Requirement kind: workflow\n- Related requirements: CMD-003, CMD-004, CMD-005\n\
    \nA user must be able to override the default Pi tool allowlist with `PI_EN_BWRAP_DEFAULT_TOOLS`,\
    \ for least-privilege runs, tool experiments, or extension/custom tools registered\
    \ with Pi."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: UC-015
  item_id: PIEN-FRQ-20260612-210000-015
  status: active
  title: Control network and environment exposure
  body: "#### UC-015 \u2014 Control network and environment exposure\n\n- Type: Functional\
    \ requirement\n- Requirement kind: workflow\n- Related requirements: ENV-001,\
    \ ENV-002, ENV-003, ENV-004, ENV-005, NET-001, NET-002\n\nThe sandbox must share\
    \ host networking by default for model provider access, allow users to disable\
    \ network sharing with `PI_EN_BWRAP_NET=0`, and allow selected extra environment\
    \ variables through `PI_EN_BWRAP_PASS_ENV`."
