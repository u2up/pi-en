- requirement_key: DOC-005
  item_id: PIEN-QRQ-20260720-091907-001
  status: active
  title: Document pi-en flake integration guidance
  body: "#### DOC-005 \u2014 Document pi-en flake integration guidance\n\npi-en documentation\
    \ must distinguish between a generic project devshell named\n`agent` and a pi-en-aware\
    \ agent shell built with `pi-en.lib.mkPiShell`.\n\nThe documentation must show\
    \ the canonical external-flake edit pattern:\nadding the pi-en flake input, adding\
    \ it to the `outputs` argument set,\npreserving existing `devShells`, and merging\
    \ an `agent` shell that exposes\n`pien` and the pi-en runtime. It must also explain\
    \ that copied or\nagent-generated flake changes should not replace project-specific\
    \ FHS,\ncontainer, build, or test shell policy unless explicitly requested.\n\n\
    Documentation for the helper and skill must include copyable prompts or\ncommands\
    \ for users who ask Pi to perform the flake integration from inside an\nexternal\
    \ project.\n\nDocumentation must also explain the runtime selector convention:\
    \ Nix runtime\nstartup should prefer `.#agent` when present, fall back to the\
    \ default shell\nonly when the selector is absent, and fail visibly rather than\
    \ hiding an\nexisting but broken `.#agent` shell."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: PERF-001
  item_id: PIEN-QRQ-20260926-164321-001
  status: active
  title: Keep coordination lint scalable as coordination history grows
  body: "#### PERF-001 \u2014 Keep coordination lint scalable as coordination history\
    \ grows\n\n`pi-en-coord-lint` must remain practical to run as a routine coordination\n\
    guard after the coordination domain accumulates many closed items,\nrequirements,\
    \ and item-matched tests.\n\nFull lint must avoid repeated full item-tree rescans\
    \ for checks that can be\nanswered from one per-run item metadata index. In particular,\
    \ matching\n`tests/items/**/*.sh` scripts back to coordination items must use\
    \ indexed item\nIDs or filename stems rather than scanning every item for each\
    \ test script.\n\nAny incremental or cached lint mode must be derived from content-addressed\n\
    inputs such as item file content or Git blob hashes, relevant repo manifest\n\
    content, linter version, and relevant item-test content. It must not rely on a\n\
    mutable `linted` flag stored inside coordination item YAML.\n\nA full lint mode\
    \ must remain the authoritative validation path and must still\nrun global checks\
    \ such as duplicate item IDs, duplicate active requirement\nkeys, orphan test\
    \ scripts, repo manifest consistency, and design coverage\nvalidation."
  applicable_repos: null
  behavior_coverage: optional
- requirement_key: BHV-003
  item_id: PIEN-QRQ-20261024-215018-001
  status: active
  title: Isolated deterministic behavior execution
  body: "#### BHV-003 \u2014 Isolated deterministic behavior execution\n\nThe behavior\
    \ runner must execute every scenario in a fresh temporary state\ndirectory and\
    \ remove that state after the result is reported. It must set a\ndeterministic\
    \ baseline including `TZ=UTC`, a fixed locale, isolated `HOME`,\nand explicit\
    \ temporary work and state paths. Results must identify both the\nBHV and scenario\
    \ ID.\n\nBehavior commands must neither discover nor inherit `PI_EN_COORD_DIR`\
    \ and\nmust not read, write, pull, or otherwise use a developer's real coordination\n\
    checkout. A coordination behavior adapter must instead create its own\ntemporary\
    \ project and bare remote. Only `pien behavior requirements snapshot`\nmay read\
    \ coordination state, and then only from its required explicit\n`--coord-dir`\
    \ argument."
  applicable_repos:
  - pi-en
  behavior_coverage: required
- requirement_key: BHV-004
  item_id: PIEN-QRQ-20261024-215021-001
  status: active
  title: Local requirement-to-behavior coverage reporting
  body: "#### BHV-004 \u2014 Local requirement-to-behavior coverage reporting\n\n\
    `pien behavior requirements snapshot` must require `--coord-dir` and a\nrepository\
    \ ID, read that explicit coordination source without modifying it,\nand write\
    \ only `pi-en-behaviors/requirements.snapshot.yaml`. The tracked\nsnapshot records\
    \ source revision, repository ID, requirement key, item ID,\nstatus, title, body,\
    \ applicability, and behavior-coverage policy.\n\nRequirements may declare `applicable_repos`\
    \ (omission means domain-wide) and\n`behavior_coverage` as `required`, `optional`,\
    \ or `not-applicable`.\nCoordination may validate only the shape of issue/requirement\
    \ BHV references;\nlocal behavior tooling validates existence to avoid a cross-repository\
    \ CI\ndependency.\n\n`pien behavior coverage` must work only from local tracked\
    \ artifacts, report\nJSON on request, and detect missing snapshot requirements,\
    \ inactive or\nsuperseded claims, missing active coverage for applicable required\n\
    requirements, and active BHVs without executable scenarios. Compliance is\nadvisory\
    \ by default and may be enforced only after a repository explicitly\nselects enforced\
    \ mode. Requirement snapshots and coverage are optional for\nexternal-project\
    \ adoption: a project can initialize, author, lint, and test\nits project-local\
    \ BHVs using only its own repository. They become available\nonly when that project\
    \ deliberately supplies an explicit coordination source\nand chooses to use requirement\
    \ traceability."
  applicable_repos:
  - pi-en
  behavior_coverage: required
