language_version: v1
groups:
  - features/dispatcher
  - features/coordination
  - features/behavior-specifications
terms:
  isolated fixture:
    phase: given
    args: {name: string}
  coordination fixture:
    phase: given
    args: {name: string}
  dispatcher command:
    phase: when
    args: {command: string}
  open item command:
    phase: when
    args: {title: string}
  lint command:
    phase: when
    args: {}
  status command:
    phase: when
    args: {}
  coverage report command:
    phase: when
    args: {}
  behavior group listing:
    phase: when
    args: {group: string}
  behavior catalog generation:
    phase: when
    args: {}
  dispatcher output:
    phase: then
    args: {contains: string, succeeds: boolean}
  item is listed:
    phase: then
    args: {}
  lint rejects missing test:
    phase: then
    args: {}
  state is unchanged:
    phase: then
    args: {}
  runner environment is isolated:
    phase: then
    args: {}
  coverage report passes:
    phase: then
    args: {}
  behavior output:
    phase: then
    args: {contains: string}
